<title>VoxelCraft Singleplayer Fixed</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; overflow:hidden; background:#000; height:100%; font-family:'Segoe UI', Tahoma, Verdana, sans-serif; user-select:none; }
  canvas { display:block; }
  .hidden { display:none !important; }

  /* Прицел */
  #crosshair { position:fixed; top:50%; left:50%; width:18px; height:18px; transform:translate(-50%,-50%); pointer-events:none; z-index:10; }
  #crosshair::before, #crosshair::after { content:''; position:absolute; background:rgba(255,255,255,0.9); box-shadow:0 0 2px #000; }

  #crosshair::after { top:8px; left:0; width:18px; height:2px; }

  /* Хотбар */
  #hotbar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:4px; z-index:10; background:rgba(0,0,0,0.5); padding:4px; border-radius:6px; border:2px solid rgba(255,255,255,0.2); }
  .slot { width:48px; height:48px; background:rgba(20,20,20,0.6); border:2px solid rgba(255,255,255,0.2); border-radius:4px; position:relative; background-repeat:no-repeat; background-size:70% 70%; background-position:center; image-rendering:pixelated; box-sizing:border-box; cursor:pointer; }
  .slot.selected { border-color:#fff; box-shadow:0 0 10px rgba(255,255,255,0.9); background-color:rgba(255,255,255,0.15); }
  .slot .count { position:absolute; bottom:1px; right:4px; color:#fff; font-size:11px; font-weight:bold; text-shadow:1px 1px 2px #000; }

  #debug { position:fixed; top:8px; left:8px; color:#e8e8e8; background:rgba(0,0,0,0.65); padding:8px 12px; font:12px/1.5 'Consolas', monospace; z-index:15; white-space:pre; border-radius:4px; border:1px solid rgba(255,255,255,0.1); }

  /* Индикатор добычи */
  #miningBar { position:fixed; top:58%; left:50%; transform:translate(-50%,0); width:120px; height:6px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.4); z-index:10; border-radius:3px; overflow:hidden; }
  #miningBar .fill { height:100%; width:0%; background:linear-gradient(90deg, #4caf50, #8bc34a); }

  /* Уведомление */
  #toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); color:#fff; padding:8px 20px; border-radius:20px; z-index:30; font-size:14px; border:1px solid rgba(255,255,255,0.2); }

  .menuOverlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:rgba(10,14,23,0.85); backdrop-filter:blur(4px); color:#fff; z-index:20; gap:12px; text-align:center; }
  .menuOverlay h1 { font-size:42px; margin:0; letter-spacing:3px; text-shadow:3px 3px 0 #2e7d32; }
  .menuOverlay h2 { margin:0 0 10px 0; font-size:24px; }
  
  .btnGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:340px; }
  button.menuBtn { background:#2a2a2a; color:#fff; border:1px solid rgba(255,255,255,0.25); padding:10px 16px; font-size:14px; cursor:pointer; border-radius:4px; transition:all .15s ease; font-weight:600; }

  .tabHeader { display:flex; gap:8px; margin-bottom:8px; }

  .tabBtn.active { background:#4caf50; color:#fff; }

  #modeBadge { position:fixed; top:10px; right:10px; background:rgba(0,0,0,0.5); padding:4px 10px; border-radius:4px; font-size:12px; color:#81c784; border:1px solid rgba(255,255,255,0.1); }

<script type="module">
import * as THREE from "three";

/* =====================================================================================
   VOXELCRAFT — ИСПРАВЛЕННЫЙ ДВИЖОК С ПОЛНОЙ ПОДДЕРЖКОЙ ТЕКСТУР И ОСВЕЩЕНИЯ
   ===================================================================================== */

const CHUNK_SIZE = 16;
const CHUNK_HEIGHT = 64;
const SEA_LEVEL = 22;
const GRAVITY = 22;
const JUMP_SPEED = 7.5;
const SAVE_KEY = 'voxelcraft_sp_world_v3';

function mod(n, m) { return ((n % m) + m) % m; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// Блоки
const BLOCK = {
  AIR:0, GRASS:1, DIRT:2, STONE:3, SAND:4, WOOD:5, LEAVES:6,
  WATER:7, COAL_ORE:8, IRON_ORE:9, DIAMOND_ORE:10, SNOW:11, BEDROCK:12,
  CACTUS:13, GLASS:14, COBBLESTONE:15, PLANKS:16, BRICKS:17, GOLD_ORE:18,
  REDSTONE_ORE:19, EMERALD_ORE:20, OBSIDIAN:21, FLOWER:22
};

const ATLAS_COLS = 8, ATLAS_ROWS = 8, ATLAS_CELL_PX = 16;
const ATLAS_CELLS = {
  grass_top:[0,0], grass_side:[1,0], dirt:[2,0], stone:[3,0],
  sand:[4,0], wood_side:[5,0], wood_top:[6,0], leaves:[7,0],
  water:[0,1], coal_ore:[1,1], iron_ore:[2,1], diamond_ore:[3,1],
  snow_top:[4,1], bedrock:[5,1], cactus_side:[6,1], cactus_top:[7,1],
  glass:[0,2], cobblestone:[1,2], planks:[2,2], bricks:[3,2],
  gold_ore:[4,2], redstone_ore:[5,2], emerald_ore:[6,2], obsidian:[7,2],
  flower:[0,3]
};

const BLOCK_DEF = {
  [BLOCK.AIR]: { name:'Воздух', solid:false, transparent:true },
  [BLOCK.GRASS]: { name:'Трава', solid:true, hardness:0.6, drop:BLOCK.DIRT, faces:{top:'grass_top', bottom:'dirt', side:'grass_side'} },
  [BLOCK.DIRT]: { name:'Земля', solid:true, hardness:0.5, faces:{all:'dirt'} },
  [BLOCK.STONE]: { name:'Камень', solid:true, hardness:1.5, drop:BLOCK.COBBLESTONE, faces:{all:'stone'} },
  [BLOCK.SAND]: { name:'Песок', solid:true, hardness:0.5, faces:{all:'sand'} },
  [BLOCK.WOOD]: { name:'Древесина', solid:true, hardness:1.0, faces:{top:'wood_top', bottom:'wood_top', side:'wood_side'} },
  [BLOCK.LEAVES]: { name:'Листва', solid:true, hardness:0.2, transparent:true, faces:{all:'leaves'} },
  [BLOCK.WATER]: { name:'Вода', solid:false, transparent:true, faces:{all:'water'} },
  [BLOCK.COAL_ORE]: { name:'Угольная руда', solid:true, hardness:1.5, faces:{all:'coal_ore'} },
  [BLOCK.IRON_ORE]: { name:'Железная руда', solid:true, hardness:2.0, faces:{all:'iron_ore'} },
  [BLOCK.DIAMOND_ORE]: { name:'Алмазная руда', solid:true, hardness:3.0, faces:{all:'diamond_ore'} },
  [BLOCK.SNOW]: { name:'Снег', solid:true, hardness:0.4, faces:{all:'snow_top'} },
  [BLOCK.BEDROCK]: { name:'Бедрок', solid:true, unbreakable:true, faces:{all:'bedrock'} },
  [BLOCK.CACTUS]: { name:'Кактус', solid:true, hardness:0.6, faces:{top:'cactus_top', bottom:'cactus_top', side:'cactus_side'} },
  [BLOCK.GLASS]: { name:'Стекло', solid:true, hardness:0.3, transparent:true, faces:{all:'glass'} },
  [BLOCK.COBBLESTONE]: { name:'Булыжник', solid:true, hardness:1.5, faces:{all:'cobblestone'} },
  [BLOCK.PLANKS]: { name:'Доски', solid:true, hardness:1.0, faces:{all:'planks'} },
  [BLOCK.BRICKS]: { name:'Кирпичи', solid:true, hardness:2.0, faces:{all:'bricks'} },
  [BLOCK.GOLD_ORE]: { name:'Золотая руда', solid:true, hardness:2.5, faces:{all:'gold_ore'} },
  [BLOCK.REDSTONE_ORE]: { name:'Редстоун руда', solid:true, hardness:2.0, faces:{all:'redstone_ore'} },
  [BLOCK.EMERALD_ORE]: { name:'Изумрудная руда', solid:true, hardness:3.0, faces:{all:'emerald_ore'} },
  [BLOCK.OBSIDIAN]: { name:'Обсидиан', solid:true, hardness:8.0, faces:{all:'obsidian'} },
  [BLOCK.FLOWER]: { name:'Цветок', solid:false, transparent:true, faces:{all:'flower'} }
};

/* ============================== ШУМ И ГЕНЕРАЦИЯ ============================== */

function mulberry32(seed) {
  let s = seed >>> 0;
  return function() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class SimplexNoise3D {
  constructor(seed = 1337) {
    const rand = mulberry32(seed);
    this.p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) this.p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const tmp = this.p[i]; this.p[i] = this.p[j]; this.p[j] = tmp;
    }
    this.perm = new Uint8Array(512);
    for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
  }
  noise(x, y, z) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = x*x*x*(x*(x*6-15)+10), v = y*y*y*(y*(y*6-15)+10), w = z*z*z*(z*(z*6-15)+10);
    const p = this.perm;
    const A = p[X]+Y, AA = p[A]+Z, AB = p[A+1]+Z, B = p[X+1]+Y, BA = p[B]+Z, BB = p[B+1]+Z;
    const grad = (hash, x, y, z) => {
      const h = hash & 15;
      const u = h<8 ? x : y, v = h<4 ? y : h===12||h===14 ? x : z;
      return ((h&1)===0 ? u : -u) + ((h&2)===0 ? v : -v);
    };
    return lerp(w, lerp(v, lerp(u, grad(p[AA], x, y, z), grad(p[BA], x-1, y, z)),
                           lerp(u, grad(p[AB], x, y-1, z), grad(p[BB], x-1, y-1, z))),
                   lerp(v, lerp(u, grad(p[AA+1], x, y, z-1), grad(p[BA+1], x-1, y, z-1)),
                           lerp(u, grad(p[AB+1], x, y-1, z-1), grad(p[BB+1], x-1, y-1, z-1))));
  }
}
function lerp(t, a, b) { return a + t * (b - a); }

/* ============================== АТЛАС ТЕКСТУР ============================== */

function createAtlasTexture() {
  const S = ATLAS_CELL_PX;
  const canvas = document.createElement('canvas');
  canvas.width = S * ATLAS_COLS; canvas.height = S * ATLAS_ROWS;
  const ctx = canvas.getContext('2d');
  const rng = mulberry32(101);

  const drawCell = (name, fillFn) => {
    const [c, r] = ATLAS_CELLS[name];
    ctx.save(); ctx.translate(c * S, r * S);
    fillFn(ctx, rng, S);
    ctx.restore();
  };

  const noiseFill = (c, r, s, baseH, baseS, baseL, varL) => {
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const l = clamp(baseL + (r() - 0.5) * varL, 5, 95);
      c.fillStyle = `hsl(${baseH},${baseS}%,${l}%)`;
      c.fillRect(x, y, 1, 1);
    }
  };

  drawCell('grass_top', (c,r,s) => noiseFill(c,r,s, 110, 50, 35, 15));
  drawCell('grass_side', (c,r,s) => {
    noiseFill(c,r,s, 28, 40, 30, 10);
    c.fillStyle = 'hsl(110,50%,35%)';
    for(let x=0; x<s; x++) c.fillRect(x, 0, 1, 4 + Math.floor(r()*3));
  });
  drawCell('dirt', (c,r,s) => noiseFill(c,r,s, 28, 40, 28, 12));
  drawCell('stone', (c,r,s) => noiseFill(c,r,s, 0, 0, 48, 14));
  drawCell('sand', (c,r,s) => noiseFill(c,r,s, 45, 50, 70, 10));
  drawCell('wood_side', (c,r,s) => {
    noiseFill(c,r,s, 30, 40, 32, 8);
    c.fillStyle = 'rgba(0,0,0,0.15)';
    for(let x=0; x<s; x+=2) c.fillRect(x, 0, 1, s);
  });
  drawCell('wood_top', (c,r,s) => noiseFill(c,r,s, 32, 45, 42, 10));
  drawCell('leaves', (c,r,s) => noiseFill(c,r,s, 120, 50, 28, 16));
  drawCell('water', (c,r,s) => noiseFill(c,r,s, 205, 70, 50, 10));
  drawCell('cobblestone', (c,r,s) => noiseFill(c,r,s, 0, 0, 38, 20));
  drawCell('planks', (c,r,s) => noiseFill(c,r,s, 32, 50, 45, 8));
  drawCell('bricks', (c,r,s) => {
    c.fillStyle = '#8d3c2b'; c.fillRect(0,0,s,s);
    c.fillStyle = '#ccc';
    for(let y=3; y<s; y+=4) c.fillRect(0,y,s,1);
    for(let x=3; x<s; x+=4) c.fillRect(x,0,1,s);
  });
  drawCell('glass', (c,r,s) => {
    c.fillStyle = 'rgba(200,240,255,0.4)'; c.fillRect(0,0,s,s);
    c.fillStyle = '#fff'; c.fillRect(0,0,s,1); c.fillRect(0,0,1,s);
  });
  drawCell('obsidian', (c,r,s) => noiseFill(c,r,s, 270, 40, 15, 10));
  drawCell('snow_top', (c,r,s) => noiseFill(c,r,s, 200, 20, 92, 6));
  drawCell('bedrock', (c,r,s) => noiseFill(c,r,s, 0, 0, 15, 20));
  drawCell('cactus_side', (c,r,s) => noiseFill(c,r,s, 125, 55, 30, 10));
  drawCell('cactus_top', (c,r,s) => noiseFill(c,r,s, 125, 60, 35, 8));
  drawCell('flower', (c,r,s) => {
    c.fillStyle = '#e91e63'; c.fillRect(6,4,4,4);
    c.fillStyle = '#4caf50'; c.fillRect(7,8,2,8);
  });

  const drawOre = (cell, color) => drawCell(cell, (c,r,s) => {
    noiseFill(c,r,s, 0, 0, 48, 14);
    c.fillStyle = color;
    for(let i=0; i<5; i++) c.fillRect(Math.floor(r()*14), Math.floor(r()*14), 2, 2);
  });
  drawOre('coal_ore', '#222');
  drawOre('iron_ore', '#d7ccc8');
  drawOre('gold_ore', '#ffd54f');
  drawOre('redstone_ore', '#f44336');
  drawOre('diamond_ore', '#4dd0e1');
  drawOre('emerald_ore', '#66bb6a');

  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.flipY = false; // КРИТИЧЕСКИЙ ФИКС: отключает переворот текстуры!
  return { texture: tex, canvas };
}

function getUVsForCell(cellName) {
  const [col, row] = ATLAS_CELLS[cellName] || [0,0];
  const u0 = col / ATLAS_COLS, v0 = row / ATLAS_ROWS;
  return { u0, v0, u1: u0 + 1 / ATLAS_COLS, v1: v0 + 1 / ATLAS_ROWS };
}

function buildBlockIconURLs(atlasCanvas) {
  const urls = {};
  for (const id in BLOCK_DEF) {
    if (+id === BLOCK.AIR) continue;
    const def = BLOCK_DEF[id];
    const cellName = def.faces ? (def.faces.all || def.faces.top || def.faces.side) : 'dirt';
    const [col, row] = ATLAS_CELLS[cellName] || [0,0];
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(atlasCanvas, col*16, row*16, 16, 16, 0, 0, 32, 32);
    urls[id] = c.toDataURL();
  }
  return urls;
}

/* ============================== МИР И ЧАНКИ ============================== */

class Chunk {
  constructor(cx, cz) {
    this.cx = cx; this.cz = cz;
    this.blocks = new Uint8Array(CHUNK_SIZE * CHUNK_HEIGHT * CHUNK_SIZE);
    this.mesh = null; this.transMesh = null;
    this.edits = null;
  }
  idx(x, y, z) { return x + z * CHUNK_SIZE + y * CHUNK_SIZE * CHUNK_SIZE; }
  getBlock(x, y, z) {
    if (x<0||x>=CHUNK_SIZE||z<0||z>=CHUNK_SIZE||y<0||y>=CHUNK_HEIGHT) return BLOCK.AIR;
    return this.blocks[this.idx(x,y,z)];
  }
  setBlock(x, y, z, id) { this.blocks[this.idx(x,y,z)] = id; }
}

class World {
  constructor(seed = 12345) {
    this.seed = seed;
    this.noise = new SimplexNoise3D(seed);
    this.chunks = new Map();
    this.persistedEdits = new Map();
  }
  key(cx, cz) { return cx + ',' + cz; }
  getChunk(cx, cz) { return this.chunks.get(this.key(cx, cz)); }

  getBlock(x, y, z) {
    const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
    if (fy < 0 || fy >= CHUNK_HEIGHT) return BLOCK.AIR;
    const cx = Math.floor(fx / CHUNK_SIZE), cz = Math.floor(fz / CHUNK_SIZE);
    const c = this.getChunk(cx, cz);
    if (!c) return BLOCK.AIR;
    return c.getBlock(mod(fx, CHUNK_SIZE), fy, mod(fz, CHUNK_SIZE));
  }

  isSolid(x, y, z) {
    const id = this.getBlock(x, y, z);
    return BLOCK_DEF[id] ? BLOCK_DEF[id].solid : false;
  }

  setBlock(x, y, z, id) {
    const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
    const cx = Math.floor(fx / CHUNK_SIZE), cz = Math.floor(fz / CHUNK_SIZE);
    const c = this.getChunk(cx, cz);
    if (!c) return false;
    const lx = mod(fx, CHUNK_SIZE), lz = mod(fz, CHUNK_SIZE);
    c.setBlock(lx, fy, lz, id);
    if (!c.edits) c.edits = {};
    c.edits[`${lx},${fy},${lz}`] = id;
    return true;
  }

  generateChunkTerrain(chunk) {
    const { cx, cz } = chunk;
    for (let lz = 0; lz < CHUNK_SIZE; lz++) {
      for (let lx = 0; lx < CHUNK_SIZE; lx++) {
        const wx = cx * CHUNK_SIZE + lx, wz = cz * CHUNK_SIZE + lz;
        const n2d = this.noise.noise(wx * 0.015, 0, wz * 0.015);
        const h = Math.floor(SEA_LEVEL + n2d * 14);

        for (let y = 0; y < CHUNK_HEIGHT; y++) {
          let id = BLOCK.AIR;
          if (y === 0) id = BLOCK.BEDROCK;
          else if (y < h - 3) id = BLOCK.STONE;
          else if (y < h) id = BLOCK.DIRT;
          else if (y === h) id = (h >= SEA_LEVEL) ? BLOCK.GRASS : BLOCK.SAND;
          else if (y <= SEA_LEVEL) id = BLOCK.WATER;

          // 3D Шум Пещер
          if (id === BLOCK.STONE || id === BLOCK.DIRT) {
            const caveN = this.noise.noise(wx * 0.05, y * 0.08, wz * 0.05);
            if (caveN > 0.42) id = BLOCK.AIR;
          }

          // Руды
          if (id === BLOCK.STONE) {
            const r = Math.abs(this.noise.noise(wx*0.2, y*0.2, wz*0.2));
            if (y < 12 && r > 0.38) id = BLOCK.DIAMOND_ORE;
            else if (y < 20 && r > 0.35) id = BLOCK.GOLD_ORE;
            else if (y < 35 && r > 0.32) id = BLOCK.IRON_ORE;
            else if (r > 0.3) id = BLOCK.COAL_ORE;
          }

          chunk.setBlock(lx, y, lz, id);
        }
      }
    }
  }

  loadChunk(cx, cz) {
    const k = this.key(cx, cz);
    if (this.chunks.has(k)) return this.chunks.get(k);
    const chunk = new Chunk(cx, cz);
    this.generateChunkTerrain(chunk);
    if (this.persistedEdits.has(k)) {
      const edits = this.persistedEdits.get(k);
      for (const pos in edits) {
        const [x,y,z] = pos.split(',').map(Number);
        chunk.setBlock(x,y,z, edits[pos]);
      }
    }
    this.chunks.set(k, chunk);
    return chunk;
  }
}

/* ============================== МЕШИНГ ============================== */

const FACES = [
  { dir:[0,1,0], u:[1,0,0], v:[0,0,-1], key:'top' },
  { dir:[0,-1,0], u:[1,0,0], v:[0,0,1], key:'bottom' },
  { dir:[0,0,1], u:[1,0,0], v:[0,1,0], key:'side' },
  { dir:[0,0,-1], u:[-1,0,0], v:[0,1,0], key:'side' },
  { dir:[1,0,0], u:[0,0,-1], v:[0,1,0], key:'side' },
  { dir:[-1,0,0], u:[0,0,1], v:[0,1,0], key:'side' }
];

function buildChunkMesh(world, chunk, useAO) {
  const pos = [], norm = [], uv = [], col = [], idx = [];
  const tPos = [], tNorm = [], tUV = [], tCol = [], tIdx = [];
  let iO = 0, iT = 0;

  for (let y = 0; y < CHUNK_HEIGHT; y++) {
    for (let z = 0; z < CHUNK_SIZE; z++) {
      for (let x = 0; x < CHUNK_SIZE; x++) {
        const id = chunk.getBlock(x, y, z);
        if (id === BLOCK.AIR) continue;
        const def = BLOCK_DEF[id];
        const wx = chunk.cx * CHUNK_SIZE + x, wy = y, wz = chunk.cz * CHUNK_SIZE + z;

        for (const f of FACES) {
          const nx = wx + f.dir[0], ny = wy + f.dir[1], nz = wz + f.dir[2];
          const neighbor = world.getBlock(nx, ny, nz);
          const nDef = BLOCK_DEF[neighbor];
          
          let showFace = false;
          if (def.transparent) showFace = neighbor !== id;
          else showFace = !nDef || !nDef.solid || nDef.transparent;

          if (!showFace) continue;

          const cellName = def.faces ? (def.faces[f.key] || def.faces.all || 'dirt') : 'dirt';
          const { u0, v0, u1, v1 } = getUVsForCell(cellName);

          const isTrans = def.transparent;
          const pArr = isTrans ? tPos : pos;
          const nArr = isTrans ? tNorm : norm;
          const uArr = isTrans ? tUV : uv;
          const cArr = isTrans ? tCol : col;
          const iArr = isTrans ? tIdx : idx;
          let baseIdx = isTrans ? iT : iO;

          const corners = [[-1,-1], [1,-1], [1,1], [-1,1]];
          for (const [uS, vS] of corners) {
            const px = wx + 0.5 + f.dir[0]*0.5 + f.u[0]*uS*0.5 + f.v[0]*vS*0.5;
            const py = wy + 0.5 + f.dir[1]*0.5 + f.u[1]*uS*0.5 + f.v[1]*vS*0.5;
            const pz = wz + 0.5 + f.dir[2]*0.5 + f.u[2]*uS*0.5 + f.v[2]*vS*0.5;

            let bright = 1.0;
            if (useAO && !isTrans) {
              const s1 = world.isSolid(nx+f.u[0]*uS, ny+f.u[1]*uS, nz+f.u[2]*uS) ? 1 : 0;
              const s2 = world.isSolid(nx+f.v[0]*vS, ny+f.v[1]*vS, nz+f.v[2]*vS) ? 1 : 0;
              const c0 = world.isSolid(nx+f.u[0]*uS+f.v[0]*vS, ny+f.u[1]*uS+f.v[1]*vS, nz+f.u[2]*uS+f.v[2]*vS) ? 1 : 0;
              const ao = (s1 && s2) ? 0 : (3 - (s1 + s2 + c0));
              bright = [0.5, 0.7, 0.85, 1.0][ao];
            }

            pArr.push(px, py, pz);
            nArr.push(f.dir[0], f.dir[1], f.dir[2]);
            uArr.push(uS < 0 ? u0 : u1, vS < 0 ? v1 : v0);
            cArr.push(bright, bright, bright);
          }

          iArr.push(baseIdx, baseIdx+1, baseIdx+2, baseIdx, baseIdx+2, baseIdx+3);
          if (isTrans) iT += 4; else iO += 4;
        }
      }
    }
  }

  const createGeo = (p, n, u, c, i) => {
    if (p.length === 0) return null;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(n, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(u, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
    g.setIndex(i);
    return g;
  };

  return { opaqueGeo: createGeo(pos, norm, uv, col, idx), transGeo: createGeo(tPos, tNorm, tUV, tCol, tIdx) };
}

/* ============================== ИГРОК И BHOP ============================== */

class Player {
  constructor(world) {
    this.world = world;
    this.position = new THREE.Vector3(0.5, 30, 0.5);
    this.velocity = new THREE.Vector3();
    this.halfWidth = 0.3; this.height = 1.8; this.eyeHeight = 1.62;
    this.grounded = false;
    this.isFlying = false;
    this.gamemode = 'survival';
    this.bobbing = 0;
  }

  getAABB(pos) {
    return { minX: pos.x - this.halfWidth, maxX: pos.x + this.halfWidth,
             minY: pos.y, maxY: pos.y + this.height,
             minZ: pos.z - this.halfWidth, maxZ: pos.z + this.halfWidth };
  }

  collidesAt(pos) {
    if (this.gamemode === 'creative' && this.isFlying) return false;
    const b = this.getAABB(pos);
    for (let x = Math.floor(b.minX); x <= Math.floor(b.maxX); x++)
      for (let y = Math.floor(b.minY); y <= Math.floor(b.maxY); y++)
        for (let z = Math.floor(b.minZ); z <= Math.floor(b.maxZ); z++)
          if (this.world.isSolid(x, y, z)) return true;
    return false;
  }

  update(dt, input) {
    const wishDir = new THREE.Vector3();
    if (input.forward) wishDir.add(input.forwardDir);
    if (input.back) wishDir.sub(input.forwardDir);
    if (input.right) wishDir.add(input.rightDir);
    if (input.left) wishDir.sub(input.rightDir);
    if (wishDir.lengthSq() > 0) wishDir.normalize();

    if (this.gamemode === 'creative' && this.isFlying) {
      const flySpeed = input.sprint ? 16 : 8;
      this.velocity.x = wishDir.x * flySpeed;
      this.velocity.z = wishDir.z * flySpeed;
      if (input.jump) this.velocity.y = flySpeed;
      else if (input.crouch) this.velocity.y = -flySpeed;
      else this.velocity.y = 0;

      this.position.addScaledVector(this.velocity, dt);
      return;
    }

    const speed = input.sprint ? 7.2 : 4.5;

    if (this.grounded) {
      const currentSpeed = Math.hypot(this.velocity.x, this.velocity.z);
      if (currentSpeed > 0) {
        const drop = currentSpeed * 8.0 * dt;
        const newSpeed = Math.max(0, currentSpeed - drop) / currentSpeed;
        this.velocity.x *= newSpeed;
        this.velocity.z *= newSpeed;
      }
      if (wishDir.lengthSq() > 0) {
        this.velocity.x = wishDir.x * speed;
        this.velocity.z = wishDir.z * speed;
      }
      if (input.jump) {
        this.velocity.y = JUMP_SPEED;
        this.grounded = false;
      }
    } else {
      const wishSpeed = speed;
      const currentSpeed = this.velocity.dot(wishDir);
      const addSpeed = wishSpeed - currentSpeed;
      if (addSpeed > 0) {
        const accelSpeed = Math.min(addSpeed, 35.0 * wishSpeed * dt);
        this.velocity.x += accelSpeed * wishDir.x;
        this.velocity.z += accelSpeed * wishDir.z;
      }
      this.velocity.y -= GRAVITY * dt;
    }

    this.moveAxis('x', this.velocity.x * dt);
    this.moveAxis('y', this.velocity.y * dt);
    this.moveAxis('z', this.velocity.z * dt);

    const checkGround = this.position.clone(); checkGround.y -= 0.05;
    this.grounded = this.collidesAt(checkGround);

    if (this.grounded && (this.velocity.x !== 0 || this.velocity.z !== 0)) {
      this.bobbing += dt * 10;
    } else {
      this.bobbing = 0;
    }
  }

  moveAxis(axis, delta) {
    if (delta === 0) return;
    const next = this.position.clone(); next[axis] += delta;
    if (!this.collidesAt(next)) { this.position.copy(next); return; }
    this.velocity[axis] = 0;
  }
}

/* ============================== ЧАНКИ И СПАВН ============================== */

function updateChunksAroundPlayer() {
  const pcx = Math.floor(player.position.x / CHUNK_SIZE);
  const pcz = Math.floor(player.position.z / CHUNK_SIZE);
  const rd = settings.renderDistance;

  for (let dx = -rd; dx <= rd; dx++) {
    for (let dz = -rd; dz <= rd; dz++) {
      const cx = pcx + dx, cz = pcz + dz;
      let chunk = world.getChunk(cx, cz);
      if (!chunk) {
        chunk = world.loadChunk(cx, cz);
        remeshChunk(chunk);
      }
    }
  }
}

function remeshChunk(chunk) {
  if (chunk.mesh) scene.remove(chunk.mesh);
  if (chunk.transMesh) scene.remove(chunk.transMesh);

  const { opaqueGeo, transGeo } = buildChunkMesh(world, chunk, settings.ao);
  if (opaqueGeo) {
    chunk.mesh = new THREE.Mesh(opaqueGeo, opaqueMat);
    scene.add(chunk.mesh);
  }
  if (transGeo) {
    chunk.transMesh = new THREE.Mesh(transGeo, transMat);
    scene.add(chunk.transMesh);
  }
}

function spawnPlayerOnSurface() {
  updateChunksAroundPlayer();
  let surfaceY = CHUNK_HEIGHT - 1;
  for (let y = CHUNK_HEIGHT - 1; y >= 0; y--) {
    const id = world.getBlock(0, y, 0);
    if (id !== BLOCK.AIR && id !== BLOCK.WATER) {
      surfaceY = y + 2;
      break;
    }
  }
  player.position.set(0.5, surfaceY, 0.5);
}

function raycast() {
  const origin = camera.getWorldPosition(new THREE.Vector3());
  const dir = camera.getWorldDirection(new THREE.Vector3());
  const step = 0.05, maxDist = 6;
  const p = origin.clone();

  for (let d = 0; d < maxDist; d += step) {
    p.addScaledVector(dir, step);
    const bx = Math.floor(p.x), by = Math.floor(p.y), bz = Math.floor(p.z);
    const id = world.getBlock(bx, by, bz);
    if (id !== BLOCK.AIR && id !== BLOCK.WATER) {
      const prev = p.clone().addScaledVector(dir, -step);
      const px = Math.floor(prev.x), py = Math.floor(prev.y), pz = Math.floor(prev.z);
      return { block:[bx,by,bz], place:[px,py,pz], id };
    }
  }
  return null;
}

/* ============================== ИНВЕНТАРЬ И ХОТБАР ============================== */

function initInventory() {
  inventory[0] = { id: BLOCK.GRASS, count: 64 };
  inventory[1] = { id: BLOCK.DIRT, count: 64 };
  inventory[2] = { id: BLOCK.STONE, count: 64 };
  inventory[3] = { id: BLOCK.WOOD, count: 64 };
  inventory[4] = { id: BLOCK.PLANKS, count: 64 };
  inventory[5] = { id: BLOCK.GLASS, count: 64 };
  renderHotbar();
}

function renderHotbar() {
  const el = document.getElementById('hotbar');
  el.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const s = inventory[i];
    const div = document.createElement('div');
    div.className = 'slot' + (i === selectedSlot ? ' selected' : '');
    if (s) {
      div.style.backgroundImage = `url(${iconURLs[s.id]})`;
      div.innerHTML = `<div class="count">${s.count > 1 ? s.count : ''}</div>`;
    }
    el.appendChild(div);
  }
}

function renderInventoryUI() {
  const grid = document.getElementById('invGrid');
  grid.innerHTML = '';
  for (let i = 0; i < inventory.length; i++) {
    const s = inventory[i];
    const div = document.createElement('div');
    div.className = 'slot';
    if (s) {
      div.style.backgroundImage = `url(${iconURLs[s.id]})`;
      div.innerHTML = `<div class="count">${s.count > 1 ? s.count : ''}</div>`;
    }
    div.onclick = () => handleSlotClick(i);
    grid.appendChild(div);
  }

  const crGrid = document.getElementById('creativeGrid');
  crGrid.innerHTML = '';
  for (const id in BLOCK_DEF) {
    if (+id === BLOCK.AIR) continue;
    const div = document.createElement('div');
    div.className = 'slot';
    div.style.backgroundImage = `url(${iconURLs[id]})`;
    div.onclick = () => {
      inventory[selectedSlot] = { id: +id, count: 64 };
      renderHotbar();
    };
    crGrid.appendChild(div);
  }
}

function handleSlotClick(idx) {
  if (!carriedItem) {
    if (inventory[idx]) {
      carriedItem = inventory[idx];
      inventory[idx] = null;
    }
  } else {
    if (!inventory[idx]) {
      inventory[idx] = carriedItem;
      carriedItem = null;
    } else {
      const tmp = inventory[idx];
      inventory[idx] = carriedItem;
      carriedItem = tmp;
    }
  }
  renderInventoryUI();
  renderHotbar();
}

function addItem(id, count) {
  for (let i = 0; i < inventory.length; i++) {
    if (inventory[i] && inventory[i].id === id && inventory[i].count < 64) {
      inventory[i].count += count;
      renderHotbar();
      return;
    }
  }
  for (let i = 0; i < inventory.length; i++) {
    if (!inventory[i]) {
      inventory[i] = { id, count };
      renderHotbar();
      return;
    }
  }
}

/* ============================== ВВОД И СОБЫТИЯ ============================== */

const input = { forward:false, back:false, left:false, right:false, jump:false, crouch:false, sprint:false, mouseLeft:false, forwardDir:new THREE.Vector3(), rightDir:new THREE.Vector3() };

window.addEventListener('keydown', e => {
  switch(e.code) {
    case 'KeyW': input.forward = true; break;
    case 'KeyS': input.back = true; break;
    case 'KeyA': input.left = true; break;
    case 'KeyD': input.right = true; break;
    case 'Space': 
      if (player.gamemode === 'creative' && e.repeat === false) {
        player.isFlying = !player.isFlying;
      }
      input.jump = true; break;
    case 'ShiftLeft': input.crouch = true; input.sprint = true; break;
    case 'KeyE': toggleInventory(); break;
    case 'F3': toggleDebug(); e.preventDefault(); break;
    case 'Escape': togglePause(); break;
    default:
      if (e.code.startsWith('Digit')) {
        const n = +e.code.replace('Digit','');
        if (n >= 1 && n <= 9) { selectedSlot = n - 1; renderHotbar(); }
      }
  }
});

window.addEventListener('keyup', e => {
  switch(e.code) {
    case 'KeyW': input.forward = false; break;
    case 'KeyS': input.back = false; break;
    case 'KeyA': input.left = false; break;
    case 'KeyD': input.right = false; break;
    case 'Space': input.jump = false; break;
    case 'ShiftLeft': input.crouch = false; input.sprint = false; break;
  }
});

document.addEventListener('mousemove', e => {
  if (locked) {
    const s = settings.sensitivity * 0.002;
    yawObject.rotation.y -= e.movementX * s;
    camera.rotation.x = clamp(camera.rotation.x - e.movementY * s, -Math.PI/2 + 0.01, Math.PI/2 - 0.01);
  }
});

renderer.domElement.addEventListener('mousedown', e => {
  if (!locked) { renderer.domElement.requestPointerLock(); return; }
  if (e.button === 0) input.mouseLeft = true;
  if (e.button === 2) placeBlock();
});

renderer.domElement.addEventListener('mouseup', e => { if (e.button === 0) input.mouseLeft = false; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
renderer.domElement.addEventListener('wheel', e => {
  selectedSlot = (selectedSlot + Math.sign(e.deltaY) + 9) % 9;
  renderHotbar();
});

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
});

/* ============================== СТРОИТЕЛЬСТВО И ДОБЫЧА ============================== */

function handleMining(dt) {
  const hit = raycast();
  if (!hit) { highlightMesh.visible = false; updateMiningUI(0); return; }

  highlightMesh.visible = true;
  highlightMesh.position.set(hit.block[0]+0.5, hit.block[1]+0.5, hit.block[2]+0.5);

  if (input.mouseLeft) {
    const def = BLOCK_DEF[hit.id];
    if (player.gamemode === 'creative' || def.hardness === 0) {
      breakBlock(hit.block[0], hit.block[1], hit.block[2], hit.id);
      return;
    }

    const key = hit.block.join(',');
    if (miningKey !== key) { miningKey = key; miningProgress = 0; }
    miningProgress += dt;
    updateMiningUI(miningProgress / def.hardness);

    if (miningProgress >= def.hardness) {
      breakBlock(hit.block[0], hit.block[1], hit.block[2], hit.id);
      miningProgress = 0;
      updateMiningUI(0);
    }
  } else {
    miningProgress = 0;
    updateMiningUI(0);
  }
}

function breakBlock(x, y, z, id) {
  world.setBlock(x, y, z, BLOCK.AIR);
  const cx = Math.floor(x / CHUNK_SIZE), cz = Math.floor(z / CHUNK_SIZE);
  remeshChunk(world.getChunk(cx, cz));

  if (player.gamemode === 'survival') {
    const def = BLOCK_DEF[id];
    addItem(def.drop || id, 1);
  }
}

function placeBlock() {
  const hit = raycast();
  if (!hit) return;
  const slot = inventory[selectedSlot];
  if (!slot && player.gamemode === 'survival') return;

  const blockId = slot ? slot.id : BLOCK.STONE;
  const [px, py, pz] = hit.place;

  world.setBlock(px, py, pz, blockId);
  const cx = Math.floor(px / CHUNK_SIZE), cz = Math.floor(pz / CHUNK_SIZE);
  remeshChunk(world.getChunk(cx, cz));

  if (player.gamemode === 'survival' && slot) {
    slot.count--;
    if (slot.count <= 0) inventory[selectedSlot] = null;
    renderHotbar();
  }
}

function updateMiningUI(prog) {
  const bar = document.getElementById('miningBar');
  if (prog <= 0) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.querySelector('.fill').style.width = Math.min(100, prog * 100) + '%';
}

/* ============================== СОХРАНЕНИЕ ============================== */

function saveWorld() {
  const editsData = {};
  for (const [k, v] of world.persistedEdits) editsData[k] = v;
  for (const [k, chunk] of world.chunks) if (chunk.edits) editsData[k] = chunk.edits;

  const saveState = {
    seed: world.seed,
    playerPos: player.position.toArray(),
    inventory,
    gamemode: player.gamemode,
    edits: editsData
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(saveState));
  toast('Мир сохранен!');
  document.getElementById('btnContinue').classList.remove('hidden');
}

function loadWorld() {
  const dataRaw = localStorage.getItem(SAVE_KEY);
  if (!dataRaw) { toast('Сохранение не найдено!'); return false; }

  const data = JSON.parse(dataRaw);
  world = new World(data.seed);
  player.world = world;
  player.position.fromArray(data.playerPos);
  inventory = data.inventory;
  setGamemode(data.gamemode || 'survival');

  for (const k in data.edits) world.persistedEdits.set(k, data.edits[k]);

  renderHotbar();
  toast('Мир загружен!');
  return true;
}

/* ============================== UI МЕНЮ ============================== */

function togglePause() {
  if (!gameStarted || inventoryOpen) return;
  paused = !paused;
  document.getElementById('pauseMenu').classList.toggle('hidden', !paused);
  if (paused && document.pointerLockElement) document.exitPointerLock();
  else if (!paused) renderer.domElement.requestPointerLock();
}

function toggleInventory() {
  if (!gameStarted || paused) return;
  inventoryOpen = !inventoryOpen;
  document.getElementById('inventoryScreen').classList.toggle('hidden', !inventoryOpen);
  if (inventoryOpen) {
    renderInventoryUI();
    if (document.pointerLockElement) document.exitPointerLock();
  } else {
    renderer.domElement.requestPointerLock();
  }
}

function toggleDebug() {
  document.getElementById('debug').classList.toggle('hidden');
}

function setGamemode(mode) {
  player.gamemode = mode;
  document.getElementById('modeBadge').textContent = `Режим: ${mode === 'creative' ? 'Креатив' : 'Выживание'}`;
  document.getElementById('btnToggleGamemode').textContent = `Режим: ${mode === 'creative' ? 'Креатив' : 'Выживание'}`;
  document.getElementById('creativePalette').classList.toggle('hidden', mode !== 'creative');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

document.getElementById('btnNewGame').onclick = () => {
  document.getElementById('startScreen').classList.add('hidden');
  startGame(false);
};
document.getElementById('btnContinue').onclick = () => {
  if (loadWorld()) {
    document.getElementById('startScreen').classList.add('hidden');
    startGame(true);
  }
};
document.getElementById('btnResume').onclick = togglePause;
document.getElementById('btnSave').onclick = saveWorld;
document.getElementById('btnLoad').onclick = loadWorld;
document.getElementById('btnQuit').onclick = () => location.reload();

document.getElementById('btnToggleGamemode').onclick = () => {
  setGamemode(player.gamemode === 'creative' ? 'survival' : 'creative');
};
document.getElementById('btnOpenSettings').onclick = document.getElementById('btnPauseSettings').onclick = () => {
  document.getElementById('settingsMenu').classList.remove('hidden');
};
document.getElementById('btnCloseSettings').onclick = () => {
  document.getElementById('settingsMenu').classList.add('hidden');
};

document.getElementById('fovSlider').oninput = e => {
  settings.fov = +e.target.value;
  document.getElementById('fovVal').textContent = settings.fov;
  camera.fov = settings.fov; camera.updateProjectionMatrix();
};
document.getElementById('fpsSelect').onchange = e => { settings.fpsLimit = +e.target.value; };
document.getElementById('renderDistSlider').oninput = e => {
  settings.renderDistance = +e.target.value;
  document.getElementById('rdVal').textContent = settings.renderDistance;
};
document.getElementById('aoCheck').onchange = e => {
  settings.ao = e.target.checked;
  world.chunks.forEach(c => remeshChunk(c));
};
document.getElementById('btnToggleFullscreen').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

document.getElementById('tabInvBtn').onclick = () => {
  document.getElementById('tabInvBtn').classList.add('active');
  document.getElementById('tabCraftBtn').classList.remove('active');
  document.getElementById('creativePalette').classList.add('hidden');
};
document.getElementById('tabCraftBtn').onclick = () => {
  document.getElementById('tabCraftBtn').classList.add('active');
  document.getElementById('tabInvBtn').classList.remove('active');
  document.getElementById('creativePalette').classList.remove('hidden');
};

if (localStorage.getItem(SAVE_KEY)) {
  document.getElementById('btnContinue').classList.remove('hidden');
}

/* ============================== ГЛАВНЫЙ ЦИКЛ ============================== */

function startGame(loaded = false) {
  gameStarted = true;
  if (!loaded) {
    initInventory();
    spawnPlayerOnSurface();
  }
  renderer.domElement.requestPointerLock();
}

let lastTime = performance.now();
let fpsCounter = 0, fpsDisplay = 0, fpsTimer = 0;

function animate(now) {
  requestAnimationFrame(animate);

  const delta = (now - lastTime) / 1000;
  if (settings.fpsLimit > 0 && delta < (1 / settings.fpsLimit) - 0.001) return;
  lastTime = now;

  const dt = Math.min(delta, 0.1);

  fpsCounter++;
  fpsTimer += dt;
  if (fpsTimer >= 1.0) {
    fpsDisplay = fpsCounter;
    fpsCounter = 0; fpsTimer = 0;
  }

  if (gameStarted && !paused && !inventoryOpen) {
    input.forwardDir.set(0, 0, -1).applyQuaternion(yawObject.quaternion); input.forwardDir.y = 0; input.forwardDir.normalize();
    input.rightDir.set(1, 0, 0).applyQuaternion(yawObject.quaternion); input.rightDir.y = 0; input.rightDir.normalize();

    player.update(dt, input);
    
    let bobY = 0;
    if (settings.bobbing) bobY = Math.sin(player.bobbing) * 0.05;

    yawObject.position.set(player.position.x, player.position.y + player.eyeHeight + bobY, player.position.z);

    updateChunksAroundPlayer();
    handleMining(dt);

    document.getElementById('debug').textContent = 
`VoxelCraft [F3]
FPS: ${fpsDisplay}
XYZ: ${player.position.x.toFixed(2)} / ${player.position.y.toFixed(2)} / ${player.position.z.toFixed(2)}
Загружено чанков: ${world.chunks.size}
Bhop скорость: ${Math.hypot(player.velocity.x, player.velocity.z).toFixed(2)} м/с
Режим: ${player.gamemode}`;
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

</script>
</body>
</html>
